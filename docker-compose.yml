services:
  postgres:
    image: postgres:16
    container_name: kitespot-radar-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: kitespot
      POSTGRES_PASSWORD: kitespot
      POSTGRES_DB: kitespot_radar
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
